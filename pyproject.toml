[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentmesh"
version = "0.1.0"
description = "Shared core for multi-agent systems: A2A agents, MCP tool servers, and a policy-enforcing gateway with JWT auth, per-agent tool permissions, tracing, and a tamper-evident audit log."
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server]>=1.3,<2",
    "mcp>=2.3,<3",
    "httpx>=0.28",
    "pyjwt>=2.10",
    "pyyaml>=6",
    "starlette>=1.0",
    "uvicorn>=0.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]
llm = ["anthropic>=2.3"]

[project.scripts]
agentmesh = "agentmesh.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentmesh"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
